<!doctype html>
<!--
  Source for public/og.png, the share card (1200x630). The PNG is a render of
  this file, so edit here and re-render with `make og-card`, which also
  records both digests in scripts/og/rendered.json and prints the URL token
  for app/layout.tsx. Never touch up the PNG.

  The card is the product's first screen at the size of a link preview: the
  product lockup, the h1, the install command in its Ink well behind the amber
  unit bar, and the published self-audit's verdict as a White sheet on Slate.

  What is a copy, and of what:
  - The mark and the unit bar are the Horizon Foundry handoff's own paths
    (reference/brand-kit.json pins them, and scripts/check-brand-assets.mjs
    holds this file to the pin by exact equality).
  - The h1 and the command are the home page's (app/page.tsx).
  - Every word and number on the sheet is the published self-audit's
    (reports/foundry-<date>.json). check-brand-assets.mjs compares them to the
    report, so a regenerated self-audit fails the gate until this card is
    re-typed and re-rendered.

  Fonts: Zalando Sans is the repo's own file (app/fonts/). IBM Plex Mono
  comes from Google Fonts, so the render needs network.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=block"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "Zalando Sans";
        src: url("../../app/fonts/ZalandoSans-wght.woff2") format("woff2");
        font-weight: 200 900;
        font-style: normal;
        font-display: block;
      }
      :root {
        --ink: #14191f;
        --bone: #e8ecf0;
        --slate: #334455;
        --white: #ffffff;
        --mist: #c9d0d8;
        --safe: #3fcb7a;
        --sans: "Zalando Sans", "Helvetica Neue", Arial, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      body {
        display: grid;
        grid-template-columns: 548px 456px;
        justify-content: space-between;
        align-items: stretch;
        padding: 56px 72px 56px 64px;
        background: var(--slate);
        color: var(--bone);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      .copy {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      /* The product lockup: the mark 44px tall, capitals 0.4 of that (Zalando's
         cap height is 0.714em), the gap 0.4 of it, the tracking 0.05em. */
      .lockup {
        display: flex;
        align-items: center;
        gap: 17.6px;
      }
      .lockup svg {
        width: 56.32px;
        height: 44px;
      }
      .lockup span {
        font-size: 24.65px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      h1 {
        font-size: 68px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.015em;
      }
      /* The command well: an Ink field, a 2px Bone border, the amber unit bar. */
      .well {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 58px;
        padding: 0 18px;
        border: 2px solid var(--bone);
        background: var(--ink);
      }
      .well svg {
        flex: none;
        width: 26px;
        height: 16.8px;
      }
      .well code {
        font: 500 17px/1 var(--mono);
        white-space: nowrap;
      }

      /* The verdict sheet: White, Ink type, 2px Ink rules, the verdict hue as
         a fill under the word, a registration tick off each corner. */
      .sheet {
        position: relative;
        align-self: center;
        border: 2px solid var(--ink);
        background: var(--white);
        color: var(--ink);
      }
      .tk {
        position: absolute;
        width: 12px;
        height: 12px;
        border: 0 solid var(--bone);
      }
      .tk-tl {
        top: -18px;
        left: -18px;
        border-right-width: 2px;
        border-bottom-width: 2px;
      }
      .tk-tr {
        top: -18px;
        right: -18px;
        border-left-width: 2px;
        border-bottom-width: 2px;
      }
      .tk-bl {
        bottom: -18px;
        left: -18px;
        border-right-width: 2px;
        border-top-width: 2px;
      }
      .tk-br {
        bottom: -18px;
        right: -18px;
        border-left-width: 2px;
        border-top-width: 2px;
      }
      .head {
        display: flex;
        justify-content: space-between;
        padding: 11px 22px;
        border-bottom: 2px solid var(--ink);
        font: 400 13px/1.4 var(--mono);
        color: var(--slate);
      }
      .head b {
        font-weight: 500;
        color: var(--ink);
      }
      .label {
        font: 600 13px/1.3 var(--sans);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .verdict {
        padding: 18px 22px 20px;
        border-bottom: 2px solid var(--ink);
        background: var(--safe);
      }
      .word {
        margin-top: 8px;
        font: 900 84px/0.86 var(--sans);
        letter-spacing: -0.02em;
        text-transform: uppercase;
      }
      .body {
        padding: 18px 22px 20px;
      }
      .body .label {
        color: var(--slate);
      }
      .posture {
        margin-top: 8px;
        font: 600 18px/1.35 var(--sans);
      }
      .sev {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        border-top: 2px solid var(--ink);
      }
      .sev div {
        padding: 11px 0 13px 14px;
        border-left: 1px solid var(--slate);
      }
      .sev div:first-child {
        padding-left: 22px;
        border-left: 0;
      }
      .sev dt {
        display: flex;
        align-items: center;
        gap: 7px;
        font: 500 12px/1.3 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--slate);
      }
      .sev i {
        width: 10px;
        height: 10px;
        border: 1px solid var(--ink);
      }
      .sev dd {
        margin-top: 5px;
        font: 500 26px/1 var(--mono);
      }
      .sev dd.zero {
        color: var(--slate);
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="lockup">
        <svg viewBox="0 0 128 100" aria-hidden="true">
          <path d="M81 40H116L99.5 62H81Z" fill="#D99A2E" />
          <path
            d="M0 0H24V40H58V0H128L111.5 22H82V100H58V40L41.5 62H24V100H0Z"
            fill="#E8ECF0"
          />
        </svg>
        <span>Foundry Skills</span>
      </div>
      <h1>Forge<br />shippable<br />software from<br />AI-built code.</h1>
      <div class="well">
        <svg viewBox="0 0 34 22" aria-hidden="true">
          <path d="M0 0H34L17.5 22H0Z" fill="#D99A2E" />
        </svg>
        <code>npx skills@latest add horizon-foundry/foundry</code>
      </div>
    </div>

    <figure class="sheet">
      <span class="tk tk-tl"></span>
      <span class="tk tk-tr"></span>
      <span class="tk tk-bl"></span>
      <span class="tk tk-br"></span>
      <div class="head">
        <span><b>/production-audit</b> on Foundry</span>
        <span data-fact="stamp">2026-10-16 · 72a0f99</span>
      </div>
      <div class="verdict">
        <p class="label">Release recommendation</p>
        <p class="word" data-fact="verdict">Safe to ship</p>
      </div>
      <div class="body">
        <p class="label" data-fact="scope">Static review + runtime pass</p>
        <p class="posture" data-fact="posture">No finding survived verification as a risk; 83 improvements to schedule, led by the work owed before the first owned report.</p>
      </div>
      <dl class="sev">
        <div>
          <dt><i style="background: #ff5c5c"></i>crit</dt>
          <dd class="zero" data-fact="critical">0</dd>
        </div>
        <div>
          <dt><i style="background: #ff9f45"></i>high</dt>
          <dd class="zero" data-fact="high">0</dd>
        </div>
        <div>
          <dt><i style="background: #f5ce4b"></i>med</dt>
          <dd data-fact="medium">10</dd>
        </div>
        <div>
          <dt><i style="background: #5ab0e6"></i>low</dt>
          <dd data-fact="low">61</dd>
        </div>
        <div>
          <dt><i style="background: #8b93a0"></i>info</dt>
          <dd data-fact="informational">12</dd>
        </div>
      </dl>
    </figure>
  </body>
</html>
