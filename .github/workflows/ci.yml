name: CI

# The check suite for main. Once the repo is public, main is the live
# `npx skills add horizon-foundry/foundry` install channel; this runs typecheck,
# lint, build, and the report-contract validation on every PR and push, so a bad
# change is DETECTED (red CI on main) even though no branch ruleset yet blocks
# the merge itself (that ruleset is a tracked launch-tail item).
# No secrets are needed: PostHog and Supabase both no-op when their env is unset,
# so the build is clean without them.

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled are here for the changelog job's `changelog-exempt`
    # waiver: without them, adding the label leaves the failed check red until
    # someone pushes, and a waiver that does not clear the gate is not a waiver.
    # The cost is that verify re-runs on a label change, which is cheap here.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: make validate

  # A pull request that changes the shipped suite (skills/, schema/, reference/)
  # must record what changed and why under CHANGELOG.md's [Unreleased], because
  # the release rolls that body up verbatim. Pull requests only: a push to main
  # is the merge, whose diff already carries whatever the PR did or waived.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-changelog.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
